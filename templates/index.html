<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Time Prediction</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background:
        linear-gradient(rgba(15, 32, 39, 0.85), rgba(32, 58, 67, 0.85)),
        url("{{ url_for('static', filename='sample.jpg') }}") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px 40px;
      width: 85%;
      max-width: 950px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      color: #fff;
      text-align: center;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #f5f5f5;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    label {
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #e0e0e0;
    }

    input, select {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.2);
      background: rgba(255,255,255,0.9);
      color: #222;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #00c6ff;
      box-shadow: 0 0 8px rgba(0,198,255,0.7);
    }

    input[type="submit"] {
      grid-column: 1 / -1;
      background: linear-gradient(90deg, #ff9800, #f44336);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    input[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(244,67,54,0.5);
    }

    .tab {
      margin-top: 30px;
      display: none;
    }

    .output {
      padding: 18px;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      animation: fadeIn 0.6s ease;
      background: rgba(200, 255, 200, 0.85);
      border: 2px solid #28a745;
      color: #1b5e20;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script>
    function showResult(event) {
      event.preventDefault();
      fetch('/predict_delivery_time?' + new URLSearchParams(new FormData(event.target)))
        .then(response => response.json())
        .then(data => {
          let resultOutput = document.getElementById('resultOutput');
          resultOutput.className = "output";
          resultOutput.innerHTML = data.Result || "Error: No prediction available.";
          document.getElementById('outputTab').style.display = 'block';
        })
        .catch(error => {
          let resultOutput = document.getElementById('resultOutput');
          resultOutput.className = "output";
          resultOutput.innerHTML = "Error: Unable to fetch prediction.";
          document.getElementById('outputTab').style.display = 'block';
        });
    }
  </script>
</head>

<body>
  <div class="container">
    <h2>Delivery Time Predictor</h2>
    <form method="get" action="/predict_delivery_time" onsubmit="showResult(event)">

      <!-- Numeric Inputs -->
      <div class="form-group"><label>Distance (km)</label><input type="number" step="0.1" name="distance_km" required></div>
      <div class="form-group"><label>Hour of Day</label><input type="number" name="hour_of_day" required></div>
      <div class="form-group"><label>Is Weekend (0/1)</label><input type="number" name="is_weekend" required></div>
      <div class="form-group"><label>Accept Hour</label><input type="number" name="accept_hour" required></div>
      <div class="form-group"><label>Accept Month</label><input type="number" name="accept_month" required></div>
      <div class="form-group"><label>No. of Orders</label><input type="number" name="No_of_orders" required></div>
      <div class="form-group"><label>Traffic Encoded</label><input type="number" name="traffic_encoded" required></div>
      <div class="form-group"><label>Num Delivery Partners</label><input type="number" name="num_delivery_partners" required></div>
      <div class="form-group"><label>Population Density</label><input type="number" name="population_density" required></div>
      <div class="form-group"><label>Is Rush Hour (0/1)</label><input type="number" name="is_rush_hour" required></div>
      <div class="form-group"><label>Weekend Rush Hour (0/1)</label><input type="number" name="weekend_rush_hour" required></div>
      <div class="form-group"><label>Distance per Minute</label><input type="number" step="0.01" name="distance_per_minute" required></div>
      <div class="form-group"><label>Orders per Partner</label><input type="number" step="0.01" name="orders_per_partner" required></div>
      <div class="form-group"><label>Density per Partner</label><input type="number" step="0.01" name="density_per_partner" required></div>
      <div class="form-group"><label>Weekend Traffic Interaction</label><input type="number" step="0.01" name="weekend_traffic_interaction" required></div>
      <div class="form-group"><label>Distance Traffic Interaction</label><input type="number" step="0.01" name="distance_traffic_interaction" required></div>

      <!-- Categoricals (values must match the trained model's known categories) -->
      <div class="form-group"><label>City</label>
        <select name="City">
          <option value="New York">New York</option>
          <option value="Houston">Houston</option>
          <option value="Los Angeles">Los Angeles</option>
          <option value="San Francisco">San Francisco</option>
          <option value="Unknown">Unknown</option>
        </select>
      </div>

      <div class="form-group"><label>Weather</label>
        <select name="Weather">
          <option value="Sunny">Sunny</option>
          <option value="Rain">Rain</option>
        </select>
      </div>

      <div class="form-group"><label>Day of Week</label>
        <select name="DayOfWeek">
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Saturday">Saturday</option>
          <option value="Sunday">Sunday</option>
        </select>
      </div>

      <div class="form-group"><label>Accept Day of Week</label>
        <select name="AcceptDayOfWeek">
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Saturday">Saturday</option>
          <option value="Sunday">Sunday</option>
        </select>
      </div>

      <div class="form-group"><label>Area of Interest</label>
        <select name="AreaOfInterest">
          <option value="Industrial">Industrial</option>
          <option value="Suburb">Suburb</option>
        </select>
      </div>

      <div class="form-group"><label>Traffic</label>
        <select name="Traffic">
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
        </select>
      </div>

      <div class="form-group"><label>Time of Day</label>
        <select name="TimeOfDay">
          <option value="morning">Morning</option>
          <option value="evening">Evening</option>
          <option value="night">Night</option>
        </select>
      </div>

      <div class="form-group"><label>Weather + Traffic</label>
        <select name="WeatherTraffic">
          <option value="Sunny_Low">Sunny + Low</option>
          <option value="Sunny_Medium">Sunny + Medium</option>
          <option value="Sunny_High">Sunny + High</option>
          <option value="Rain_Low">Rain + Low</option>
          <option value="Rain_Medium">Rain + Medium</option>
          <option value="Rain_High">Rain + High</option>
          <option value="Overcast_Low">Overcast + Low</option>
          <option value="Overcast_Medium">Overcast + Medium</option>
        </select>
      </div>

      <input type="submit" value="Predict Delivery Time">
    </form>

    <div class="tab" id="outputTab">
      <h3>Prediction Result</h3>
      <div class="output" id="resultOutput">{{Result}}</div>
    </div>
  </div>
</body>
</html>
